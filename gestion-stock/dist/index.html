    <title>Aroma · gestión de stock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema antes del primer pintado para que no haya flash de blanco
      (function () {
        try {
          var guardado = localStorage.getItem('gestion-stock:tema')
          var oscuro =
            guardado === 'oscuro' ||
            (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (oscuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
