<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icono.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icono.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <title>Stock Productos</title>
    <script>
      // Aplica el tema guardado antes de que cargue la app (evita destello claro)
      (function () {
        var t = localStorage.getItem("tema");
        if (t !== "claro" && t !== "oscuro") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
